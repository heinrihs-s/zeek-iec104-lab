name: short_burst
description: >
  Short concentrated burst of commands from a single peer.
  Useful to check that aggregation windows pick up brief activity
  without smearing it out.

shape:
  duration_seconds: 60
  records_per_second_min: 5
  records_per_second_max: 12
  asdu_type_ids: [45, 46]
  cot_default: 6  # Activation
  ioa_pool_size: 4

tags:
  - burst
  - command
  - short
